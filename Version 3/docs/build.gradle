plugins {
    id 'org.asciidoctor.jvm.convert' version '4.0.5'
}

repositories {
    mavenCentral()
}

ext {
    husstVersion = '3.7.0'
    husstVersionUl = husstVersion.replace('.', '_')
    xsl = 'xsl/HusstXsdToADoc.xsl'
    classpathSaxon = 'd:\\HN\\dev\\third\\Saxon\\SaxonHE12-5J\\saxon-he-12.5.jar'
    loglevel = project.findProperty('loglevel') ?: 'INFO'
    cwd = project.projectDir.absolutePath
}

task printProjectDir {
    doLast {
        println "Project Directory: ${project.projectDir}"
    }
}

task copyAssets(type: Copy) {
    group = "documentation"
    description = "kopiert alle nötigen Dateien nach Output"

	inputs.files fileTree("styles") {
		include "*.png", "*.svg"
	}
	inputs.files fileTree("images") {
		include "*.png", "*.svg"
	}

    from 'styles'
    from 'images'
    include '*.js', '*.png', '*.svg'
    into 'output'
    eachFile { fileCopyDetails ->
        if (fileCopyDetails.name.endsWith('.js')) {
            fileCopyDetails.path = "js/${fileCopyDetails.name}"
        } else if (fileCopyDetails.name.endsWith('.png') || fileCopyDetails.name.endsWith('.svg')) {
            fileCopyDetails.path = "images/${fileCopyDetails.name}"
        }
    }
}

task transformBasis(type: Exec) {
    group = "documentation"
    description = "transformiert xsd nach adoc"

    inputs.file "../${husstVersion}/HUSST_DvBasis_${husstVersionUl}.xsd"
    inputs.file "xsl/HusstXsdToADoc.xsl"
    outputs.file "adoc/datenversorgung/DvBasis.adoc"

    commandLine(
        "java",
        "-cp", classpathSaxon,
        "net.sf.saxon.Transform",
        "-s:../${husstVersion}/HUSST_DvBasis_${husstVersionUl}.xsd",
        "-xsl:xsl/HusstXsdToADoc.xsl",
        "-o:adoc/datenversorgung/DvBasis.adoc",
        "einstiegsebene=3",
        "defaults=${cwd}/adoc/datenversorgung/default",
        "schema=Basis",
        "verHusst=${husstVersion}",
        "loglevel=${loglevel}"
    )
}

task transformTarifAngebot(type: Exec) {
    group = "documentation"
    description = "transformiert xsd nach adoc"

    outputs.cacheIf { false }

    inputs.file "../${husstVersion}/HUSST_DvTarifAngebot_${husstVersionUl}.xsd"
    inputs.file "xsl/HusstXsdToADoc.xsl"
    outputs.file "adoc/datenversorgung/DvTarifAngebot.adoc"

    println "using loglevel = ${loglevel}"
    commandLine 'java', '-cp', classpathSaxon, 'net.sf.saxon.Transform', "-s:../${husstVersion}/HUSST_DvTarifAngebot_${husstVersionUl}.xsd", '-xsl:xsl/HusstXsdToADoc.xsl', '-o:adoc/datenversorgung/DvTarifAngebot.adoc', 'einstiegsebene=3', "defaults=${cwd}/adoc/datenversorgung/default", 'schema=TarifAngebot', "verHusst=${husstVersion}", "loglevel=${loglevel}"
}

