configurations {
    plantuml
}

dependencies {
	plantuml 'net.sourceforge.plantuml:plantuml:1.2024.5'
}

task puml(type: JavaExec) {
	group = 'documentation'
	description = 'Render PlantUML diagrams'
	
	inputs.files fileTree("diagrams") {
		include "*.puml"
	}
	// Zielordner für die SVGs
	def outputDir = file("images")
	outputs.dir(outputDir)

	classpath = configurations.plantuml
	mainClass.set('net.sourceforge.plantuml.Run')
	
	// PlantUML-Argumente
	args = ['-charset', 'UTF-8', '-tsvg', '-o', outputDir.absolutePath]
  
	// Alle .puml-Dateien anhängen
	fileTree('diagrams') {
	  include '*.puml'
	}.each { f ->
	  args += f.absolutePath
	}

}

tasks.named('asciidoctor') {
    forkOptions {
        jvmArgs '--add-opens=java.base/sun.nio.ch=ALL-UNNAMED',
                '--add-opens=java.base/java.io=ALL-UNNAMED'
    }

	inputs.files fileTree("adoc") {
		include "*.adoc"
	}
	inputs.files fileTree("styles") {
		include "*.css", "*.js", "*.png", "*.svg"
	}
	inputs.files fileTree("images") {
		include "*.png", "*.svg"
	}
	inputs.files fileTree("konfig") {
		include "*.adoc", "*.html", "*.rb"
	}
	outputs.file "output/Main.html"

	sourceDir = file("adoc")
	sources {
		include 'Main.adoc'
	}

	attributes(
		"docinfo"   : "shared",
		"docinfodir": "konfig",
		"stylesheet": 'styles/husst_roboto_orange.css',
		"docinfo2"  : ''
	)

	outputDir = file('output')
}


// zum Debuggen
task printGradlePropertiesFiles {
    group = "verification"
    def globalFile = new File(System.getProperty("user.home"), ".gradle/gradle.properties")
    def projectFile = layout.projectDirectory.file("gradle.properties").asFile

    doLast {
        println "Global gradle.properties: ${globalFile.exists() ? globalFile.absolutePath : 'nicht vorhanden'}"
        println "Projekt gradle.properties: ${projectFile.exists() ? projectFile.absolutePath : 'nicht vorhanden'}"
    }
}

asciidoctor.dependsOn transformBasis, transformTarifAngebot, transformVertrieb, transformErgebnisdaten, puml
copyAssets.dependsOn puml
build.dependsOn copyAssets, asciidoctor
