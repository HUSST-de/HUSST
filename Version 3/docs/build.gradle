    commandLine 'java', '-cp', classpathSaxon, 'net.sf.saxon.Transform', "-s:../${husstVersion}/HUSST_Ergebnisdaten_${husstVersionUl}.xsd", '-xsl:xsl/HusstXsdToADoc.xsl', '-o:adoc/ergebnisdaten/Ergebnisdaten.adoc', 'einstiegsebene=3', "defaults=${cwd}/adoc/ergebnisdaten/default", 'schema=Ergebnisdaten', "verHusst=${husstVersion}", "loglevel=${loglevel}"
